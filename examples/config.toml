# rs-mrxvt example config.
#
# Copy to ~/.config/rs-mrxvt/config.toml and edit.
# Every key is optional; sensible defaults are applied if omitted.

# ──────────────────────────────────────────────────────────────────────────
# Terminal defaults (apply to every tab unless overridden by a profile)
# ──────────────────────────────────────────────────────────────────────────
[terminal]
cols = 120
rows = 40
scrollback = 10000          # lines of scrollback history per tab
shell = "/bin/bash"          # default shell (bash); override per-profile

# ──────────────────────────────────────────────────────────────────────────
# Clipboard (copy / paste)
# ──────────────────────────────────────────────────────────────────────────
[clipboard]
copy_on_select = true        # classic xterm/mrxvt: selecting text copies it
osc52 = true                 # also mirror copies to the host terminal (OSC 52);
                             # this is what makes copy work over SSH
osc52_read = false           # allow programs (tmux/nvim) to READ the clipboard
                             # via OSC 52 queries — off by default for safety
# tool = "xclip"             # force a clipboard tool; auto-detects otherwise
                             # (xclip / xsel / wl-clipboard / pbcopy / termux)

# ──────────────────────────────────────────────────────────────────────────
# UI behavior
# ──────────────────────────────────────────────────────────────────────────
[ui]
always_show_tabs = true     # reserved (not honored by renderers yet)
disable_palette = false     # set true to disable Ctrl+Shift+P
tabbar_height = 1           # tab bar height in terminal rows (TUI backend)
theme = "mrxvt"             # built-ins: mrxvt | tokyo-night | gruvbox |
                            # dracula | solarized-dark | solarized-light,
                            # or a name from [custom_themes.*] below
focus = "click"             # reserved (not honored by renderers yet)

# ──────────────────────────────────────────────────────────────────────────
# Custom themes: full palette (16 ANSI colors + bg/fg/cursor, #RRGGBB),
# referenced by name from ui.theme. A custom theme overrides a built-in
# of the same name.
# ──────────────────────────────────────────────────────────────────────────
# [custom_themes.midnight]
# bg = "#0a0e14"
# fg = "#c5cdd7"
# cursor = "#c5cdd7"
# black = "#0a0e14"
# red = "#f07178"
# green = "#86b300"
# yellow = "#f2ae49"
# blue = "#399ee6"
# magenta = "#a37acc"
# cyan = "#4cbf99"
# white = "#c5cdd7"
# bright_black = "#565b66"
# bright_red = "#f07178"
# bright_green = "#86b300"
# bright_yellow = "#f2ae49"
# bright_blue = "#399ee6"
# bright_magenta = "#a37acc"
# bright_cyan = "#4cbf99"
# bright_white = "#ffffff"

# ──────────────────────────────────────────────────────────────────────────
# Default profile (used when rs-mrxvt is launched with no -e flag)
# ──────────────────────────────────────────────────────────────────────────
default_profile = "default"

[profiles.default]
# Empty command = run the user's default shell ($SHELL, then /etc/passwd)
# as a LOGIN shell — it sources /etc/profile, so distro GUI session
# variables (D-Bus, flatpak/snap paths) reach apps launched from the tab.
# Set login_shell = false if you don't want that.
# command = ["bash"]
login_shell = true
# cwd = "/home/user/projects"
# tag = "local"

# ──────────────────────────────────────────────────────────────────────────
# zsh profile — launched with Alt+Z
# ──────────────────────────────────────────────────────────────────────────
[profiles.zsh]
command = ["zsh"]

# ──────────────────────────────────────────────────────────────────────────
# Example: a fleet of web servers you want to broadcast to
# ──────────────────────────────────────────────────────────────────────────
[profiles.web-1]
command = ["ssh", "user@web-01.example.com"]
tag = "web"

[profiles.web-2]
command = ["ssh", "user@web-02.example.com"]
tag = "web"

[profiles.web-3]
command = ["ssh", "user@web-03.example.com"]
tag = "web"

# ──────────────────────────────────────────────────────────────────────────
# Example: a database admin tab (untagged — won't receive group broadcasts)
# ──────────────────────────────────────────────────────────────────────────
[profiles.db]
command = ["ssh", "user@db-01.example.com"]
# no tag → only receives input when active or when broadcast = All

# ──────────────────────────────────────────────────────────────────────────
# Environment overrides per profile
# ──────────────────────────────────────────────────────────────────────────
[profiles.monitoring]
command = ["htop"]
env = { HTOPRC = "/home/user/.config/htop/mrxvt-rc" }

# ──────────────────────────────────────────────────────────────────────────
# Macros: chord → command spec. Bare names cover parameterless commands;
# parameterized commands take the argument after a colon (e.g. ":web").
# ──────────────────────────────────────────────────────────────────────────
[macros]
"Ctrl+Shift+R" = "ResetTerminal"
# "Ctrl+Shift+B" = "ToggleBroadcastAll"
# "Ctrl+Shift+G" = "ToggleBroadcastGroup:web"
# "Alt+T" = "TagActiveTab:web"
# "Alt+H" = "NewTabProfile:monitoring"

# ──────────────────────────────────────────────────────────────────────────
# Pseudo-transparency + tinting — schema parses, but no renderer consumes
# it yet (planned; see README roadmap). Settings currently have no effect.
# ──────────────────────────────────────────────────────────────────────────
[transparency]
enabled = false              # set true to enable (once wired)
tint = "#004080"              # tint color as #RRGGBB
opacity = 0.85                # 0.0 (invisible) to 1.0 (opaque)
# background_image = "/path/to/wallpaper.png"   # optional
